<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMC Tract Endpoint Decoding</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.14/vue.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" v-cloak>
  <div v-if="error" class="error-msg">{{ error }}</div>
  <wmc-viewer v-else :config="config"></wmc-viewer>
</div>

<script src="viewer.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      error: null,
      config: {
        // base URL where testdata lives — override per deployment
        dataBase: 'testdata',
        // available thresholds: key = display label, value = subfolder name
        thresholds: {
          '0.15 (7 clusters)': 'thr-15',
          '0.15 (5 clusters)': 'thr-15_5clusters'
        },
        defaultThreshold: '0.15 (7 clusters)'
      }
    }
  });
</script>
</body>
</html>
